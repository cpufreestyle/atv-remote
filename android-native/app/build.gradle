plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// 版本号：根目录 VERSION（versionName / versionCode 两行）
def versionProps = new Properties()
rootProject.file("../VERSION").withInputStream { versionProps.load(it) }

android {
    namespace 'com.atv.remote'
    compileSdk 35

    defaultConfig {
        applicationId "com.atv.remote.native"
        minSdk 26
        targetSdk 35
        // 版本号单一来源：根目录 VERSION（build.sh 与 README 同样引用它，不再各写一份）
        versionCode versionProps.getProperty("versionCode").toInteger()
        versionName versionProps.getProperty("versionName")
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file("../android/debug.keystore")
            storePassword "atvremote"
            keyAlias "atvremote"
            keyPassword "atvremote"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    packagingOptions {
        // jniLibs/arm64-v8a 里除了 Chaquopy 的 .so，还装了一份专为 Android
        // 编译的 adb 和它依赖的几个库。它们必须被解压到磁盘上的 nativeLibraryDir
        // 才能被 execve（Android 10+ 起 App 私有目录都是 noexec），所以要关掉
        // 「不解压、直接从 APK 映射」的现代默认。细节见 tools/fetch-adb-android.py。
        jniLibs.useLegacyPackaging = true
    }
}

// 单一事实来源：内嵌进 APK 的 server.py / atv_*.py / static 由仓库根目录在
// 构建时生成，不再手工维护副本（漂移过一次：新后端 + 旧前端悄声发版，且旧版还多拷
// 了一层 static/static/）。根目录那份是唯一提交进仓库的，这里的副本是构建产物。
// 不跑构建的手工刷新/校验仍走 ../../sync-native.sh。
// 新增根目录 atv_*.py 时这里要跟着加一行——tests/test_delivery_manifest.py 会拿
// server.BUNDLE_PY（server.py 的 import 闭包）逐条比对，漏了就红。
tasks.register("syncPythonSrc", Copy) {
    group = "chaquopy"
    description = "从仓库根目录同步前后端到 src/main/python"
    from rootProject.file("../server.py")
    from rootProject.file("../atv_backend.py")
    from rootProject.file("../atv_media.py")
    // static 是目录：不显式 into "static" 的话 Copy 会把目录内容平铺进 src/main/python，
    // 变成「多一层 / 少一层」的经典事故（AGENTS.md 里记着 static/static/ 那次）
    from(rootProject.file("../static")) {
        into "static"
    }
    into "src/main/python"
}
preBuild.dependsOn "syncPythonSrc"
// Chaquopy 的 merge*PythonSources 直接把 src/main/python 当输入，但它不知道这个目录
// 是 syncPythonSrc 的产物（任务图里没有依赖）。不补这条，并行/增量构建时可能用手工
// 副本甚至空目录去 merge，重新引入「新后端 + 旧前端」的幽灵。
tasks.matching { it.name ==~ /merge.*PythonSources/ }.configureEach {
    dependsOn "syncPythonSrc"
}

chaquopy {
    defaultConfig {
        // Android/chaquo 的 pyatv 版本与 requirements.txt（macOS/.venv 的 0.18.0）
        // 刻意不同：同一份 server.py/atv_backend.py 要在 0.18 与 0.13 两端都正常，
        // 靠 atv_backend 的版本兼容分支兜（_filter_key_map 能力过滤、
        // ConnectionLostError 的 try/except 降级），不靠版本一致。
        pip {
            // 纯 Python 包（qrcode）没有平台原生 wheel，任何镜像都能提供；chaquo.com 挂掉
            // 时用可达镜像兜底（不影响需要 Android 原生 wheel 的包——那种只能在 chaquo 拿）。
            if (project.hasProperty("pypiMirror")) {
                options "--index-url", project.property("pypiMirror")
            }
            if (project.hasProperty("noAppletv")) {
                // chaquo.com 不可达时的降级构建：跳过 pyatv（Android 侧 Apple TV 功能关闭，
                // Android TV 全功能不受影响——server.py/atv_backend.py 对 pyatv 导入失败
                // 即优雅降级）。只为刷新内嵌的前后端，别当常规发布用。
                install "qrcode==8.2"
            } else {
                // pyatv 锁 0.13.0 而非 .venv 的 0.18.0，是 chaquo 的 Android wheel
                // 天花板逼出来的，两个硬约束叠加、缺一不可：
                //   1) cryptography：chaquo cp310/android 最高 42.0.8；pyatv 0.15+ 要
                //      >=43/44，没有 Android wheel 可装。
                //   2) zeroconf：PyPI 从 0.40 起只发平台 wheel（无 py3-none-any），chaquo
                //      索引也不托管它，最后一个纯 wheel 是 0.39.4；而 pyatv 0.14.x 要
                //      zeroconf>=0.72/0.129、0.14.0 还要 pydantic-settings（pydantic-core
                //      是 Rust，无 Android wheel）——只能退到 0.13.0。
                // 依赖一并 pin 死，避免解析器挑到装不上 / 运行时报错的组合：
                //   - protobuf <5 是硬下限：0.13.0 的 *_pb2 是 protoc<3.19 老 gencode，
                //     protobuf 5.x 运行时会抛「Descriptors cannot be created directly」。
                //   - aiohttp <3.10：3.10+ 要 yarl>=1.17，chaquo cp310 只有 1.4.2。
                install "pyatv==0.13.0"
                install "cryptography==42.0.8"
                install "aiohttp>=3.8.3,<3.10"
                install "bitarray>=2.3.0,<3"
                install "zeroconf==0.39.4"
                install "protobuf>=4.22.0,<5"
                install "qrcode==8.2"
            }
        }
    }
}
