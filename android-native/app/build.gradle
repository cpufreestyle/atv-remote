plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.atv.remote'
    compileSdk 35

    defaultConfig {
        applicationId "com.atv.remote.native"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0-native"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file("../android/debug.keystore")
            storePassword "atvremote"
            keyAlias "atvremote"
            keyPassword "atvremote"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

chaquopy {
    defaultConfig {
        // 版本必须与 requirements.txt 一致：同一份 server.py/atv_backend.py 要能在
        // 不 pin 的 0.13 与 0.18 之间表现一致，靠运气不行（atv_backend 的兼容分支已经踩到）。
        pip {
            install "pyatv==0.18.0"
            install "qrcode==8.2"
        }
    }
}
