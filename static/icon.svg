<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 与 mac/make_icon.swift、tools/make_icons.py 同一套 Apple 风格视觉：
       品牌蓝对角渐变 + 左上高光 + 底部压暗 + 白色电视屏/播放键字形（带柔和投影） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7eff"/>
      <stop offset="1" stop-color="#0047c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.24" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vig" x1="0" y1="0.66" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#vig)"/>

  <!-- 电视屏的柔和投影（向下偏移 14、模糊 26、30% 黑） -->
  <rect x="196" y="278" width="632" height="404" rx="76" fill="#000000"
        opacity="0.30" filter="url(#soft)"/>

  <!-- 白色字形：电视屏 + 支架 -->
  <g fill="#f5f8fc">
    <rect x="196" y="264" width="632" height="404" rx="76"/>
    <rect x="466" y="668" width="92" height="42" rx="8"/>
    <rect x="378" y="714" width="268" height="34" rx="17"/>
  </g>
  <!-- 播放键（品牌蓝 #064fda，中心 522,464） -->
  <path d="M456 381 L456 547 L588 464 Z" fill="#064fda"/>
</svg>

