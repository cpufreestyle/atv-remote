name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # check.sh：import 检查 + node --check + 行为回归 + 内嵌副本逐字节比对
      # （不起 adb / pyatv / 真端口，局域网鉴权分支靠清空 LOOPBACK_HOSTS 触发）
      - run: ./check.sh
